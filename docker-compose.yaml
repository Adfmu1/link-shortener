version: '0.1'

services:
  app:
    image: adfmu/shortener_app:v0.2
    ports:
      - "6090:6090"
    env_file: ".env"
    depends_on:
      - database
      - migration

  database:
    image: postgres:16.15
    restart: always
    shm_size: 128mb
    env_file: "postgres.env"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U url_app -d url_shortener"]
      interval: 5s
      timeout: 5s
      retries: 5

  migration:
    image: ghcr.io/kukymbr/goose-docker:3.28.0
    env_file: ".env"
    volumes:
      - ./sql/migrations:/migrations
    depends_on:
      database:
        condition: service_healthy